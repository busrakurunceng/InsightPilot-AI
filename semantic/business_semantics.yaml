version: 1
schema: public
language: tr

tables:
  customers:
    description: Müşteri kayıtları ve müşterinin coğrafi bilgileri.
    grain: Her satır bir müşteri kaydıdır (customer_id).
  orders:
    description: Siparişlerin durumları ve sipariş, teslimat tarihleri.
    grain: Her satır bir sipariştir (order_id).
  order_items:
    description: Sipariş içindeki ürün kalemleri, satıcı ve ürün fiyatları.
    grain: Her satır bir sipariş kalemidir (order_id ve order_item_id).
  order_payments:
    description: Siparişler için ödeme kayıtları; bir sipariş birden fazla ödeme kaydına sahip olabilir.
    grain: Her satır bir ödeme kaydıdır.
  order_reviews:
    description: Siparişlere ilişkin müşteri değerlendirmeleri.
    grain: Her satır bir değerlendirme kaydıdır.
  products:
    description: Ürünlerin kategorileri ve özellikleri.
    grain: Her satır bir üründür (product_id).
  sellers:
    description: Satıcı kayıtları ve coğrafi bilgileri.
    grain: Her satır bir satıcıdır (seller_id).
  geolocation:
    description: Posta kodu önekleriyle ilişkili coğrafi koordinat kayıtları.
    grain: Posta kodu öneki benzersiz değildir; bir önekte birden çok satır bulunabilir.
  product_category_name_translation:
    description: Portekizce ürün kategorilerinin İngilizce karşılıkları.
    grain: Her satır bir kategori çevirisidir.

logical_relationships:
  - left: products.product_category_name
    right: product_category_name_translation.product_category_name
    description: Ürün kategorisinin İngilizce adını bulmak için kullanılabilir; fiziksel FK yoktur.

metrics:
  total_orders:
    description: Seçilen satın alma tarihi aralığındaki tüm siparişlerin sayısı.
    expression: COUNT(*)
    base_table: orders
    date_column: orders.order_purchase_timestamp
    status_filter: null
  delivered_product_revenue:
    description: Teslim edilmiş siparişlerdeki ürün kalemi fiyatlarının toplamı; kargo ücreti ve ödeme toplamları dahil değildir.
    expression: SUM(order_items.price)
    base_table: order_items
    joins:
      - order_items.order_id = orders.order_id
    status_filter: orders.order_status = 'delivered'
    date_column: orders.order_purchase_timestamp
    currency: BRL
  delivered_order_aov:
    description: Teslim edilmiş ürün içeren sipariş başına ortalama ürün satış geliri.
    numerator: delivered_product_revenue
    denominator: COUNT(DISTINCT orders.order_id) among delivered orders with items
    date_column: orders.order_purchase_timestamp
    currency: BRL
  average_delivery_days:
    description: Gerçek teslimat tarihi bulunan, teslim edilmiş siparişlerde satın almadan teslimata kadar geçen ortalama gün.
    base_table: orders
    status_filter: orders.order_status = 'delivered'
    date_column: orders.order_purchase_timestamp
    required_columns:
      - orders.order_purchase_timestamp
      - orders.order_delivered_customer_date
  late_delivery_rate:
    description: Gerçek teslimatı tahmini teslimat tarihinden sonra olan siparişlerin, karşılaştırılabilir teslim edilmiş siparişlere oranı.
    base_table: orders
    status_filter: orders.order_status = 'delivered'
    date_column: orders.order_purchase_timestamp
    required_columns:
      - orders.order_delivered_customer_date
      - orders.order_estimated_delivery_date

rules:
  date_filter: Sipariş satın alma tarihi başlangıç dahil, bitiş tarihinin ertesi günü hariç olacak şekilde filtrelenir.
  revenue_caveat: delivered_product_revenue muhasebe anlamında net gelir veya ödeme tahsilatı değildir.
  join_caveat: order_items ve order_payments aynı sipariş üzerinde doğrudan birleştirilirse çoktan çoğa çoğalma ve hatalı toplam oluşabilir.
  geolocation_caveat: geolocation_zip_code_prefix benzersiz olmadığı için doğrudan join satır sayısını artırabilir.
